name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  # Pure standard-library Python: the table-builder unit + integration
  # tests. No external tool needed.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install flake8
        run: python -m pip install --upgrade pip flake8

      # Default settings, no config file — matching nf-metabarcoding, whose
      # Python is also clean at the stock 79 columns. Raising the limit would
      # be the easier option; keeping the two repos on one standard is worth
      # more than the wrapped lines cost.
      - name: Lint python sources
        run: |
          mapfile -t py_files < <(git ls-files '*.py')
          if [ "${#py_files[@]}" -gt 0 ]; then
            flake8 "${py_files[@]}"
          fi

      - name: Run python unit + integration tests
        run: python3 -m unittest discover -s tests/bin -p 'test_*.py'

  # Audit the SPECIFICATIONS <-> COVERAGE <-> tests mapping. Needs nothing
  # but grep, so it is the cheapest job here and the fastest to fail.
  coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Audit the spec/coverage/test triangle
        run: bash tests/coverage-gate.sh

  # Lint every tracked shell script. `-x` follows the sourced
  # bin/lib/validation.sh (resolved via .shellcheckrc source-path).
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck on tracked shell scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -gt 0 ]; then
            shellcheck -x "${scripts[@]}"
          fi

  # Cluster / container profile resolution, on a PINNED Nextflow as well as
  # the latest stable. Config resolution only — no scheduler, no engine, no
  # image build — so this needs nothing but Nextflow and runs in seconds.
  #
  # The matrix is the point, not decoration: a cluster config that ships a
  # block-form `singularity { }` scope silently loses the engine profile's
  # `singularity.enabled` on Nextflow 25.10.x (the version most of our sites
  # run) but not on 26.x. A single-version check cannot see that class of
  # regression, and the failure mode is a run that quietly falls back to a
  # local conda env instead of the container.
  cluster-profiles:
    strategy:
      fail-fast: false
      matrix:
        nxf_ver: ['25.10.2', 'latest-stable']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ matrix.nxf_ver }}

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Validate cluster, site and container profile wiring
        run: bats tests/config/cluster_profiles.bats

  # bats unit + CLI tests. The helper/validation tests need no external
  # tool; the CLI tests need cutadapt + vsearch and the config tests need
  # Nextflow (each skips gracefully if its tool is absent, but CI installs
  # them so the coverage is real).
  bats:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v3

      - name: Set up bioinformatics tools
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: p2t
          create-args: >-
            -c bioconda -c conda-forge
            vsearch=2.31.0
            cutadapt=5.2
            krona=2.8.1

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run bats unit + CLI tests
        run: bats tests/bin/ tests/config/

      # The pipeline publishes per-barcode results into params.fastq_dir,
      # so a test pointing that at tests/fixtures/ rather than a scratch
      # copy silently writes .sintax/.log into the committed fixtures —
      # and a dirty fixture tree then feeds the *next* run files the
      # fixture does not declare. Same gate as tests/run_all.sh step 4/4.
      - name: Assert the run did not modify tests/fixtures/
        run: |
          dirty="$(git status --porcelain -- tests/fixtures/)"
          if [ -n "${dirty}" ]; then
            echo "FAIL: the test run modified tests/fixtures/:"
            echo "${dirty}"
            exit 1
          fi
          echo "OK: tests/fixtures/ untouched"

  # nf-test: SINTAX module + end-to-end workflow. Needs Nextflow, nf-test
  # and the same tool pins as the bats CLI tests.
  nf-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v3

      - name: Install nf-test
        run: |
          curl -fsSL https://code.askimed.com/install/nf-test | bash
          sudo mv nf-test /usr/local/bin/

      - name: Set up bioinformatics tools
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: p2t
          create-args: >-
            -c bioconda -c conda-forge
            vsearch=2.31.0
            cutadapt=5.2
            krona=2.8.1

      - name: Run nf-test (modules + workflow)
        run: nf-test test tests/

      # See the note in the bats job.
      - name: Assert the run did not modify tests/fixtures/
        run: |
          dirty="$(git status --porcelain -- tests/fixtures/)"
          if [ -n "${dirty}" ]; then
            echo "FAIL: the test run modified tests/fixtures/:"
            echo "${dirty}"
            exit 1
          fi
          echo "OK: tests/fixtures/ untouched"
